# ---------------------------------------------------------------------------
# Workflow « keep-alive » — anti-hibernation Streamlit Community Cloud
#
# Streamlit Community Cloud endort une application après environ 12 heures
# sans visite. Toutes les 4 heures, ce workflow ouvre l'application dans un
# vrai navigateur (Chromium sans écran, via Playwright) : si elle dort, il
# clique sur « Yes, get this app back up! », puis attend que l'interface soit
# chargée (script .github/scripts/wake_streamlit.py).
# Un simple ping HTTP ne suffit pas : l'URL redirige via un cookie (boucle de
# redirections pour curl) et ne réveille pas une appli endormie.
#
# URL visitée : variable de dépôt APP_URL si elle existe (Settings → Secrets
# and variables → Actions → Variables), sinon l'URL publique ci-dessous.
# En cas d'échec, une capture de la page est jointe à l'exécution (Artifacts).
#
# GitHub désactive les workflows planifiés après 60 jours sans activité sur
# le dépôt : il suffit alors de le relancer une fois via Actions → « Keep-alive
# Streamlit » → « Run workflow ».
# ---------------------------------------------------------------------------
name: Keep-alive Streamlit

on:
  schedule:
    - cron: "49 */4 * * *"
  workflow_dispatch: {}

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer Playwright et Chromium
        run: |
          pip install playwright==1.63.0
          python -m playwright install --with-deps chromium

      - name: Ouvrir l'application (et la réveiller si besoin)
        env:
          APP_URL: ${{ vars.APP_URL || 'https://civ-oil-dashboard.streamlit.app/' }}
        run: python .github/scripts/wake_streamlit.py "$APP_URL"

      - name: Capture de la page en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: etat-application
          path: etat-application.png
          if-no-files-found: ignore
